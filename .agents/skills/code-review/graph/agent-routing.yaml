core_agents:
  description: "Always launched regardless of project type"
  agents:
    - name: architecture-reviewer
      template: agents/architecture-reviewer.md
      always: true
      extra_context:
        - key: RECENT_MODULE_COMMITS
          command: "git log --oneline -20 -- {paths_touched}"
        - key: COMPLEMENTARY_CONTEXT
          condition: "clean-architecture skill exists"
          action: "load clean-architecture references"

    - name: security-reviewer
      template: agents/security-reviewer.md
      always: true

    - name: simplicity-reviewer
      template: agents/simplicity-reviewer.md
      always: true

    - name: testing-reviewer
      template: agents/testing-reviewer.md
      always: true

    - name: business-logic-reviewer
      template: agents/business-logic-reviewer.md
      always: true
      complementary_skills:
        - skill: domain-expert
          condition: "domain-expert skill exists in registry"
          action: "Load domain-specific validation rules, algorithms, and invariants into COMPLEMENTARY_CONTEXT"

conditional_agents:
  description: "Launched based on diff content and project type"
  agents:
    - name: database-reviewer
      template: agents/database-reviewer.md
      conditions:
        file_patterns:
          - "**/migrations/**"
          - "**/migration/**"
          - "**/*repository*"
          - "**/*Repository*"
          - "**/*.sql"
          - "**/schema.*"
          - "**/prisma/**"
          - "**/drizzle/**"
          - "**/typeorm/**"
          - "**/sequelize/**"
          - "**/alembic/**"
          - "**/flyway/**"
          - "**/liquibase/**"
          - "**/*dao*"
          - "**/*query*"
          - "**/*model*"  # only if ORM detected
        extra_variables:
          DB_FILES: "filtered list of DB-related files from diff"

    - name: frontend-reviewer
      template: agents/frontend-reviewer.md
      conditions:
        file_patterns:
          - "**/*.tsx"
          - "**/*.jsx"
          - "**/*.vue"
          - "**/*.svelte"
          - "**/*.css"
          - "**/*.scss"
          - "**/*.sass"
          - "**/*.less"
          - "**/*.html"  # only if SPA framework detected
          - "**/*.component.ts"  # Angular
          - "**/components/**"
          - "**/pages/**"
          - "**/views/**"
          - "**/widgets/**"  # Flutter
          - "**/*.dart"  # Flutter UI files
        extra_variables:
          FRONTEND_FILES: "filtered list of frontend files from diff"

    - name: api-contracts-reviewer
      template: agents/api-contracts-reviewer.md
      conditions:
        file_patterns:
          - "**/*.sdkgen"
          - "**/openapi.*"
          - "**/swagger.*"
          - "**/*.graphql"
          - "**/*.gql"
          - "**/*.proto"
          - "**/*-generated.ts"
          - "**/generated/api.*"
          - "**/api-spec.*"
          - "**/routes.*"  # if REST framework detected
        extra_variables:
          API_FILES: "filtered list of API definition files from diff"

    - name: i18n-reviewer
      template: agents/i18n-reviewer.md
      conditions:
        file_patterns:
          - "**/locales/**"
          - "**/i18n/**"
          - "**/translations/**"
          - "**/lang/**"
          - "**/messages/**"
          - "**/*.arb"  # Flutter
        # Regex patterns matched against ADDED diff lines only.
        # Word-boundary anchors matter: a bare "t(" would match print(, format(,
        # sort( — i.e., nearly every diff — and turn this conditional agent
        # into an always-on one.
        content_patterns:
          - "useTranslation\\s*\\("
          - "\\bi18n\\.t\\("
          - "(^|[^\\w.])t\\(['\"]"    # t('key') / t("key") calls, not foo.t() or format(
          - "\\$t\\(['\"]"            # Vue-style $t('key')
          - "\\bintl\\."
          - "AppLocalizations"
        extra_variables:
          I18N_FILES: "filtered list of i18n files from diff"

    - name: error-handling-reviewer
      template: agents/error-handling-reviewer.md
      conditions:
        # Fires when the diff is large OR when ADDED lines introduce/modify
        # error-handling constructs. Bare keywords like "try"/"Error" are
        # intentionally avoided — they appear in almost any diff and would
        # defeat the purpose of conditional dispatch.
        complexity_threshold: "diff > 200 lines"
        content_patterns:
          - "\\btry\\s*[{:]"
          - "catch\\s*[({]"
          - "\\.catch\\("
          - "\\bthrow\\s+"
          - "\\braise\\s+"
          - "\\bexcept\\s+\\w"
          - "\\brescue\\b"
          - "extends\\s+\\w*(Error|Exception)"
          - "Result\\.(failed|err|ok)"
          - "ErrorBoundary"

shared_lenses:
  description: >
    Lenses without a dedicated agent. Their content is appended to the
    {LENS_CONTENT} of the listed agents so every check has an owner.
  lenses:
    - lens: references/lenses/performance.md
      appended_to:
        - architecture-reviewer   # async patterns, concurrency
        - database-reviewer       # query efficiency, resource management
        - frontend-reviewer       # rendering, payload size

mutual_exclusion:
  description: "Groups where only one agent fires"
  groups: []
  # Note: Unlike the Zig-specific version, the polyglot version has no
  # mutual exclusion groups. All agents can fire simultaneously.
