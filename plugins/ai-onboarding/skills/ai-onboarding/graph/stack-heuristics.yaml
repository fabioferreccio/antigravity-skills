# ------------------------------------------------------------------------------
# 4. Monorepo Detection
# ------------------------------------------------------------------------------
monorepo_detection:
  rules:
    - id: mono-lerna
      tool: lerna
      markers: [lerna.json]
      ecosystem: npm
      confidence: 0.95

    - id: mono-nx
      tool: nx
      markers: [nx.json, project.json]
      ecosystem: npm
      workspace_layout: "apps/ and libs/ directories"
      confidence: 0.98

    - id: mono-turborepo
      tool: turborepo
      markers: [turbo.json]
      ecosystem: npm
      workspace_layout: "apps/ and packages/ directories"
      confidence: 0.98

    - id: mono-pnpm-workspaces
      tool: pnpm-workspaces
      markers: [pnpm-workspace.yaml]
      ecosystem: pnpm
      confidence: 0.95

    - id: mono-npm-workspaces
      tool: npm-workspaces
      markers: []
      detection_rules:
        - type: file_content_match
          file: package.json
          patterns: ["\"workspaces\""]
      ecosystem: npm
      confidence: 0.85

    - id: mono-yarn-workspaces
      tool: yarn-workspaces
      markers: []
      detection_rules:
        - type: file_content_match
          file: package.json
          patterns: ["\"workspaces\""]
        - type: file_exists
          paths: [yarn.lock]
      ecosystem: yarn
      confidence: 0.85

    - id: mono-rush
      tool: rush
      markers: [rush.json]
      ecosystem: npm
      confidence: 0.95

    - id: mono-pants
      tool: pants
      markers: [pants.toml, BUILD]
      ecosystem: polyglot
      confidence: 0.95

    - id: mono-bazel
      tool: bazel
      markers: [WORKSPACE, WORKSPACE.bazel, MODULE.bazel, BUILD.bazel]
      ecosystem: polyglot
      confidence: 0.98

    - id: mono-cargo-workspaces
      tool: cargo-workspaces
      markers: []
      detection_rules:
        - type: file_content_match
          file: Cargo.toml
          patterns: ["[workspace]"]
      ecosystem: rust
      confidence: 0.95

    - id: mono-go-workspaces
      tool: go-workspaces
      markers: [go.work]
      ecosystem: go
      confidence: 0.95

  # Heuristic fallbacks when no explicit tool marker is found
  heuristic_signals:
    - signal: "Multiple package.json files at depth ≤ 2"
      suggests: monorepo
      confidence: 0.60
    - signal: "Multiple go.mod files"
      suggests: monorepo
      confidence: 0.60
    - signal: "apps/ + packages/ directory structure"
      suggests: monorepo
      confidence: 0.70

# ------------------------------------------------------------------------------
# 5. Project Type Classification
# ------------------------------------------------------------------------------
project_type_classification:
  types:
    - id: type-frontend
      type: frontend
      signals:
        - "Framework is React/Vue/Angular/Svelte/Astro without server routes"
        - "Only client-side entry points (index.html)"
        - "Build output is static assets (dist/, build/)"
        - "No server-side code or API routes"
      typical_commands:
        dev: "npm run dev"
        build: "npm run build"
        test: "npm test"

    - id: type-backend
      type: backend
      signals:
        - "Framework is Express/NestJS/Fastify/Django/Flask/FastAPI/Gin/Spring/Rails"
        - "Has server entry point (server.ts, main.go, app.py)"
        - "Database connections present"
        - "API routes defined"
        - "No frontend build pipeline"
      typical_commands:
        dev: "npm run dev / python manage.py runserver / go run ."
        build: "npm run build / go build"
        test: "npm test / pytest / go test ./..."

    - id: type-fullstack
      type: fullstack
      signals:
        - "Framework is Next.js/Nuxt/SvelteKit/Remix (SSR + client)"
        - "Both frontend and backend code present"
        - "API routes alongside UI components"
        - "Monorepo with separate frontend/backend packages"
      typical_commands:
        dev: "npm run dev"
        build: "npm run build"
        test: "npm test"

    - id: type-library
      type: library
      signals:
        - "package.json has main/module/exports fields"
        - "Cargo.toml has [lib] section"
        - "pyproject.toml configured for distribution"
        - "No application entry point"
        - "tsconfig.json with declaration: true"
        - "Rollup/tsup/unbuild config present"
      typical_commands:
        dev: "npm run dev"
        build: "npm run build / cargo build / python -m build"
        test: "npm test / cargo test / pytest"

    - id: type-cli
      type: cli
      signals:
        - "package.json has bin field"
        - "Cargo.toml has [[bin]] section"
        - "pyproject.toml has [project.scripts]"
        - "go main package with flag/cobra/cli usage"
        - "argparse, click, typer imports (Python)"
      typical_commands:
        dev: "node ./src/cli.js"
        build: "npm run build / go build / cargo build"
        test: "npm test / go test ./... / pytest"

    - id: type-monorepo
      type: monorepo
      signals:
        - "Monorepo tool detected (see monorepo_detection)"
        - "Multiple package directories"
      note: "A monorepo is typically combined with other types (frontend + backend)"

    - id: type-mobile
      type: mobile
      signals:
        - "React Native (react-native in dependencies)"
        - "Flutter (pubspec.yaml with flutter SDK)"
        - "Expo (expo in dependencies, app.json)"
        - "iOS project (.xcodeproj, .xcworkspace)"
        - "Android project (AndroidManifest.xml, build.gradle with android plugin)"
        - "Capacitor (@capacitor/core)"
        - "Ionic (@ionic/angular, @ionic/react, @ionic/vue)"
      typical_commands:
        dev: "npx expo start / flutter run / npx react-native start"
        build: "eas build / flutter build"
        test: "jest / flutter test"

    - id: type-desktop
      type: desktop
      signals:
        - "Electron (electron in dependencies)"
        - "Tauri (@tauri-apps/api, tauri.conf.json)"
        - "CEF / Chromium Embedded Framework"
        - "Qt (.pro files, CMakeLists.txt with Qt)"
        - "WPF/WinUI (.xaml files, *.csproj with WPF)"
        - "SwiftUI (macOS target in .xcodeproj)"
      typical_commands:
        dev: "npm run dev / tauri dev / electron ."
        build: "electron-builder / tauri build"
        test: "npm test"
