# ==============================================================================
# Stack Heuristics — Language, Framework, Package Manager & Project Detection
# ==============================================================================
# Decision tree used by the ai-onboarding skill to fingerprint a repository's
# technology stack from file-system signals (marker files, dependency names,
# config patterns).  Each rule carries a confidence weight so the engine can
# rank competing hypotheses when multiple signals overlap.
# ==============================================================================

# ------------------------------------------------------------------------------
# 1. Language Detection
# ------------------------------------------------------------------------------
language_detection:
  rules:
    # --- JavaScript / TypeScript -------------------------------------------
    - id: lang-js-ts
      languages: [javascript, typescript]
      markers:
        files:
          - package.json
          - tsconfig.json
          - jsconfig.json
          - .nvmrc
          - .node-version
          - .npmrc
        extensions: [.js, .jsx, .ts, .tsx, .mjs, .cjs, .mts, .cts]
      disambiguation:
        - condition: "tsconfig.json exists OR .ts/.tsx files present"
          primary: typescript
        - condition: "only .js/.jsx files, no tsconfig.json"
          primary: javascript
      confidence: 0.95

    # --- Go ----------------------------------------------------------------
    - id: lang-go
      languages: [go]
      markers:
        files: [go.mod, go.sum, go.work]
        extensions: [.go]
      confidence: 0.98

    # --- Rust --------------------------------------------------------------
    - id: lang-rust
      languages: [rust]
      markers:
        files: [Cargo.toml, Cargo.lock, rust-toolchain.toml, rust-toolchain]
        extensions: [.rs]
      confidence: 0.98

    # --- Python ------------------------------------------------------------
    - id: lang-python
      languages: [python]
      markers:
        files:
          - pyproject.toml
          - setup.py
          - setup.cfg
          - requirements.txt
          - requirements-dev.txt
          - requirements-lock.txt
          - Pipfile
          - Pipfile.lock
          - poetry.lock
          - pdm.lock
          - uv.lock
          - .python-version
          - tox.ini
          - noxfile.py
          - manage.py           # Django
          - __init__.py         # package marker
        extensions: [.py, .pyi, .pyw]
      confidence: 0.95

    # --- Java --------------------------------------------------------------
    - id: lang-java
      languages: [java]
      markers:
        files:
          - pom.xml
          - build.gradle
          - build.gradle.kts
          - settings.gradle
          - settings.gradle.kts
          - gradlew
          - mvnw
          - .java-version
        extensions: [.java]
      disambiguation:
        - condition: "build.gradle.kts with kotlin plugin AND .kt files"
          primary: kotlin
      confidence: 0.95

    # --- Kotlin ------------------------------------------------------------
    - id: lang-kotlin
      languages: [kotlin]
      markers:
        files:
          - build.gradle.kts
          - settings.gradle.kts
        extensions: [.kt, .kts]
      detection_rules:
        - type: file_content_match
          file: build.gradle.kts
          patterns:
            - "kotlin(\"jvm\")"
            - "kotlin(\"multiplatform\")"
            - "kotlin(\"android\")"
            - "org.jetbrains.kotlin"
      confidence: 0.90

    # --- C# ----------------------------------------------------------------
    - id: lang-csharp
      languages: [csharp]
      markers:
        files:
          - "*.csproj"
          - "*.sln"
          - global.json
          - Directory.Build.props
          - Directory.Packages.props
          - nuget.config
        extensions: [.cs, .csx]
      confidence: 0.95

    # --- Ruby --------------------------------------------------------------
    - id: lang-ruby
      languages: [ruby]
      markers:
        files:
          - Gemfile
          - Gemfile.lock
          - Rakefile
          - .ruby-version
          - .ruby-gemset
        extensions: [.rb, .rake, .gemspec]
      confidence: 0.95

    # --- PHP ---------------------------------------------------------------
    - id: lang-php
      languages: [php]
      markers:
        files:
          - composer.json
          - composer.lock
          - artisan                # Laravel
          - .php-cs-fixer.php
          - phpunit.xml
          - phpstan.neon
        extensions: [.php]
      confidence: 0.95

    # --- Swift -------------------------------------------------------------
    - id: lang-swift
      languages: [swift]
      markers:
        files:
          - Package.swift
          - "*.xcodeproj"
          - "*.xcworkspace"
          - "*.pbxproj"
        extensions: [.swift]
      confidence: 0.95

    # --- Dart / Flutter ----------------------------------------------------
    - id: lang-dart
      languages: [dart]
      markers:
        files:
          - pubspec.yaml
          - pubspec.lock
          - analysis_options.yaml
        extensions: [.dart]
      disambiguation:
        - condition: "pubspec.yaml contains flutter sdk dependency"
          primary: dart
          framework: flutter
      confidence: 0.95

    # --- Elixir ------------------------------------------------------------
    - id: lang-elixir
      languages: [elixir]
      markers:
        files:
          - mix.exs
          - mix.lock
          - .formatter.exs
        extensions: [.ex, .exs]
      confidence: 0.98

    # --- Scala -------------------------------------------------------------
    - id: lang-scala
      languages: [scala]
      markers:
        files:
          - build.sbt
          - project/build.properties
          - project/plugins.sbt
          - .scalafmt.conf
        extensions: [.scala, .sc]
      confidence: 0.95

    # --- Clojure -----------------------------------------------------------
    - id: lang-clojure
      languages: [clojure]
      markers:
        files:
          - deps.edn
          - project.clj
          - shadow-cljs.edn
          - bb.edn                # Babashka
        extensions: [.clj, .cljs, .cljc, .edn]
      confidence: 0.95

    # --- Zig ---------------------------------------------------------------
    - id: lang-zig
      languages: [zig]
      markers:
        files:
          - build.zig
          - build.zig.zon
        extensions: [.zig]
      confidence: 0.98

    # --- C / C++ -----------------------------------------------------------
    - id: lang-c-cpp
      languages: [c, cpp]
      markers:
        files:
          - CMakeLists.txt
          - Makefile
          - GNUmakefile
          - configure
          - configure.ac
          - meson.build
          - conanfile.txt
          - conanfile.py
          - vcpkg.json
          - "*.vcxproj"
        extensions: [.c, .h, .cpp, .cxx, .cc, .hpp, .hxx, .hh]
      disambiguation:
        - condition: "only .c and .h files"
          primary: c
        - condition: ".cpp, .cxx, .cc, .hpp files present"
          primary: cpp
      confidence: 0.90

# ------------------------------------------------------------------------------
# 2. Framework Detection
# ------------------------------------------------------------------------------
framework_detection:
  rules:
    # ===== JavaScript / TypeScript Frameworks =====

    # --- React ---
    - id: fw-react
      framework: react
      language: [javascript, typescript]
      detection:
        - type: dependency
          file: package.json
          fields: [dependencies, devDependencies]
          packages: [react, react-dom]
        - type: file_exists
          paths: [src/App.tsx, src/App.jsx, src/App.js]
      confidence: 0.95

    # --- Next.js ---
    - id: fw-nextjs
      framework: nextjs
      language: [javascript, typescript]
      detection:
        - type: dependency
          file: package.json
          fields: [dependencies, devDependencies]
          packages: [next]
        - type: file_exists
          paths: [next.config.js, next.config.mjs, next.config.ts]
        - type: directory_exists
          paths: [app/, pages/, src/app/, src/pages/]
      meta:
        version_check: "next --version"
        app_router_signal: "app/ directory with layout.tsx"
        pages_router_signal: "pages/ directory with _app.tsx"
      confidence: 0.98

    # --- Vite ---
