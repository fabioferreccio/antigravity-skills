# ------------------------------------------------------------------------------
# 3. Package Manager Detection
# ------------------------------------------------------------------------------
package_manager_detection:
  rules:
    # --- Node.js Package Managers ---
    - id: pm-npm
      manager: npm
      language: [javascript, typescript]
      markers:
        lockfiles: [package-lock.json]
        configs: [.npmrc]
      install_command: "npm install"
      ci_command: "npm ci"
      confidence: 0.95

    - id: pm-yarn-classic
      manager: yarn-classic
      language: [javascript, typescript]
      markers:
        lockfiles: [yarn.lock]
        configs: [.yarnrc]
      detection_rules:
        - type: file_content_match
          file: package.json
          patterns: ["\"packageManager\": \"yarn@1"]
        - type: not_exists
          paths: [.yarnrc.yml]
      install_command: "yarn install"
      ci_command: "yarn install --frozen-lockfile"
      confidence: 0.90

    - id: pm-yarn-berry
      manager: yarn-berry
      language: [javascript, typescript]
      markers:
        lockfiles: [yarn.lock]
        configs: [.yarnrc.yml]
      detection_rules:
        - type: file_exists
          paths: [.yarnrc.yml, .yarn/]
      install_command: "yarn install"
      ci_command: "yarn install --immutable"
      confidence: 0.95

    - id: pm-pnpm
      manager: pnpm
      language: [javascript, typescript]
      markers:
        lockfiles: [pnpm-lock.yaml]
        configs: [.npmrc]                 # pnpm respects .npmrc
      install_command: "pnpm install"
      ci_command: "pnpm install --frozen-lockfile"
      confidence: 0.98

    - id: pm-bun
      manager: bun
      language: [javascript, typescript]
      markers:
        lockfiles: [bun.lockb, bun.lock]
        configs: [bunfig.toml]
      install_command: "bun install"
      ci_command: "bun install --frozen-lockfile"
      confidence: 0.98

    # --- Python Package Managers ---
    - id: pm-pip
      manager: pip
      language: [python]
      markers:
        lockfiles: []
        configs: [requirements.txt, requirements-dev.txt]
      install_command: "pip install -r requirements.txt"
      confidence: 0.80

    - id: pm-pip-tools
      manager: pip-tools
      language: [python]
      markers:
        lockfiles: [requirements.txt]     # compiled output
        configs: [requirements.in]
      install_command: "pip-sync"
      confidence: 0.90

    - id: pm-poetry
      manager: poetry
      language: [python]
      markers:
        lockfiles: [poetry.lock]
        configs: [pyproject.toml]
      detection_rules:
        - type: file_content_match
          file: pyproject.toml
          patterns: ["[tool.poetry]"]
      install_command: "poetry install"
      ci_command: "poetry install --no-interaction"
      confidence: 0.95

    - id: pm-pdm
      manager: pdm
      language: [python]
      markers:
        lockfiles: [pdm.lock]
        configs: [pyproject.toml]
      detection_rules:
        - type: file_content_match
          file: pyproject.toml
          patterns: ["[tool.pdm]"]
      install_command: "pdm install"
      confidence: 0.95

    - id: pm-uv
      manager: uv
      language: [python]
      markers:
        lockfiles: [uv.lock]
        configs: [pyproject.toml]
      detection_rules:
        - type: file_exists
          paths: [uv.lock]
        - type: file_content_match
          file: pyproject.toml
